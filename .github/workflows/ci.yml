name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests include the WCAG AA contrast guard (tests/contrast.test.ts).
      - run: npm test
      - run: npm run build
      # Fail on known high/critical vulnerabilities in dependencies.
      - run: npm audit --audit-level=high
